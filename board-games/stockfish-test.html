<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Stockfish test</title></head>
<body>
<pre id="log">starting…</pre>
<script>
  const logEl = document.getElementById("log");
  const lines = [];
  function log(line) {
    lines.push(String(line));
    logEl.textContent = lines.join("\n");
    if (lines.length > 200) lines.splice(0, 100);
  }
  window.__sf = { lines, done: false, error: null, best: null };
  try {
    const w = new Worker("vendor/stockfish/stockfish-17.1-lite-single.js");
    let phase = 0;
    w.onmessage = (e) => {
      const text = typeof e.data === "string" ? e.data : JSON.stringify(e.data);
      if (!text) return;
      if (text.indexOf("bestmove") === 0) {
        window.__sf.best = text;
        window.__sf.done = true;
        log("DONE " + text);
        w.terminate();
        return;
      }
      if (phase < 40) log(text);
      phase++;
      if (text === "uciok") {
        w.postMessage("setoption name Threads value 1");
        w.postMessage("setoption name Hash value 16");
        w.postMessage("isready");
      } else if (text === "readyok") {
        w.postMessage("position startpos");
        w.postMessage("go depth 10");
        log("searching...");
      }
    };
    w.onerror = (e) => {
      window.__sf.error = e.message || "worker error";
      log("WORKER ERROR: " + JSON.stringify({ message: e.message, filename: e.filename, lineno: e.lineno }));
      window.__sf.done = true;
    };
    w.postMessage("uci");
    log("worker created");
  } catch (err) {
    window.__sf.error = String(err);
    log("THROW: " + err);
    window.__sf.done = true;
  }
</script>
</body>
</html>
