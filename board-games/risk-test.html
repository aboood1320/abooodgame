<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Risk test harness</title>
<link rel="stylesheet" href="board-games.css">
<link rel="stylesheet" href="css/risk.css">
<link rel="stylesheet" href="css/fx.css">
<style>
  body { padding: 16px; background: #070c11; }
  #mount { max-width: 1500px; margin: 0 auto; }
</style>
</head>
<body>
<div id="mount"></div>
<script src="js/core.js"></script>
<script src="js/fx.js"></script>
<script src="js/ai.js"></script>
<script src="js/games/risk-map-data.js"></script>
<script src="js/games/risk.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const game = (window.BG.games || []).find((g) => g.id === "risk");
  if (!game) { document.getElementById("mount").textContent = "risk game not registered"; return; }
  const params = new URLSearchParams(location.search);
  const humans = params.has("humans") ? Math.max(1, Number(params.get("humans"))) : 1;
  const total = params.has("players") ? Math.max(2, Math.min(6, Number(params.get("players")))) : 3;
  const overrides = {};
  ["setup", "victory", "cards", "fortify", "reinforce"].forEach((key) => {
    if (params.has(key)) overrides[key] = params.get(key);
  });
  const players = [];
  for (let i = 0; i < total; i++) {
    const human = i < humans;
    players.push({ name: human ? (i === 0 ? "القائد البشري" : "لاعب " + (i + 1)) : "الكمبيوتر " + (i + 1), type: human ? "human" : "cpu", level: i === 2 ? "hard" : "normal" });
  }
  const api = {
    stage: document.getElementById("mount"),
    players,
    cpuCount: players.filter((p) => p.type === "cpu").length,
    options: Object.assign({}, game.options.defaults, overrides),
    toast(message, tone) { console.log("[toast]", tone || "", message); },
    log(message, kind) { console.log("[log]", kind || "", message.replace(/<[^>]+>/g, "")); },
    rules() {},
    setStatus(text) { document.title = "Risk — " + text; },
    gameOver(result) { console.log("[gameOver]", result); },
    newGame() {},
    net: null,
  };
  const instance = game.create(api.stage, api);
  window.__riskTest = { instance, api, game, mount: api.stage };
});
</script>
</body>
</html>
