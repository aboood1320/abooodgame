<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ألعاب الطاولة — شاشة البداية</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: "Segoe UI", "Tahoma", "Arial", sans-serif;
    color: #f6f2e8;
    background:
      radial-gradient(70% 46% at 50% 30%, rgba(88, 211, 168, 0.18), transparent 70%),
      radial-gradient(60% 40% at 50% 96%, rgba(225, 180, 92, 0.16), transparent 72%),
      linear-gradient(168deg, #14262d 0%, #0b1a20 46%, #07120f 100%);
  }
  .wrap {
    display: grid;
    justify-items: center;
    gap: clamp(14px, 2.6vmin, 34px);
    padding: 6vmin;
    text-align: center;
  }
  .logo {
    width: clamp(140px, 34vmin, 460px);
    height: auto;
    filter: drop-shadow(0 26px 48px rgba(0, 0, 0, 0.66));
  }
  h1 {
    margin: 0;
    font-size: clamp(34px, 8.4vmin, 108px);
    font-weight: 900;
    letter-spacing: -0.01em;
    background: linear-gradient(180deg, #fff6dd, #e9c471 62%, #c9973c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p {
    margin: 0;
    font-size: clamp(15px, 2.5vmin, 34px);
    line-height: 1.7;
    color: rgba(246, 242, 232, 0.7);
  }
  .pills {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(6px, 1.4vmin, 18px);
    margin-top: clamp(4px, 1.2vmin, 14px);
  }
  .pills span {
    padding: clamp(5px, 1vmin, 12px) clamp(10px, 2.2vmin, 26px);
    border-radius: 999px;
    border: 1px solid rgba(225, 180, 92, 0.28);
    background: rgba(225, 180, 92, 0.08);
    color: #ffe3a8;
    font-size: clamp(11px, 1.8vmin, 24px);
    font-weight: 700;
    white-space: nowrap;
  }
  .brand {
    margin-top: clamp(18px, 5vmin, 70px);
    font-size: clamp(11px, 1.7vmin, 22px);
    letter-spacing: 0.32em;
    color: rgba(246, 242, 232, 0.42);
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="icon.svg" alt="" />
    <h1>ألعاب الطاولة</h1>
    <p>١٦ لعبة عربية أصيلة · قواعد كاملة · ذكاء اصطناعي بثلاثة مستويات<br />ولعب جماعي مع أصدقائك حول العالم</p>
    <div class="pills">
      <span>🎲 محلي</span>
      <span>🌍 عالمي</span>
      <span>🤖 ذكاء اصطناعي</span>
    </div>
    <div class="brand">نُبلاء</div>
  </main>
</body>
</html>
