<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ألعاب الطاولة">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172b32"/>
      <stop offset="0.55" stop-color="#0d1c21"/>
      <stop offset="1" stop-color="#07120f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3a8"/>
      <stop offset="1" stop-color="#c08a35"/>
    </linearGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef8179"/><stop offset="1" stop-color="#b8423c"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb0ea"/><stop offset="1" stop-color="#3f6aa8"/>
    </linearGradient>
    <linearGradient id="tileC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ccb9c"/><stop offset="1" stop-color="#3b845c"/>
    </linearGradient>
    <linearGradient id="tileD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c873"/><stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#58d3a8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#58d3a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="14" y="14" width="484" height="484" rx="102" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.5"/>

  <g filter="url(#shadow)">
    <rect x="102" y="102" width="136" height="136" rx="34" fill="url(#tileA)"/>
    <rect x="274" y="102" width="136" height="136" rx="34" fill="url(#tileB)"/>
    <rect x="102" y="274" width="136" height="136" rx="34" fill="url(#tileC)"/>
    <rect x="274" y="274" width="136" height="136" rx="34" fill="url(#tileD)"/>
  </g>

  <g opacity="0.85">
    <circle cx="170" cy="170" r="17" fill="#fff" opacity="0.82"/>
    <circle cx="342" cy="170" r="17" fill="#fff" opacity="0.82"/>
    <circle cx="170" cy="342" r="17" fill="#fff" opacity="0.82"/>
    <circle cx="342" cy="342" r="17" fill="#fff" opacity="0.82"/>
  </g>

  <g transform="translate(256 256) rotate(-8)" filter="url(#shadow)">
    <rect x="-86" y="-86" width="172" height="172" rx="40" fill="#f9f4e7"/>
    <rect x="-86" y="-86" width="172" height="172" rx="40" fill="none" stroke="#0a151a" stroke-width="9" opacity="0.9"/>
    <g fill="#17211d">
      <circle cx="-40" cy="-40" r="12"/>
      <circle cx="40" cy="-40" r="12"/>
      <circle cx="0" cy="0" r="12"/>
      <circle cx="-40" cy="40" r="12"/>
      <circle cx="40" cy="40" r="12"/>
    </g>
  </g>
</svg>
